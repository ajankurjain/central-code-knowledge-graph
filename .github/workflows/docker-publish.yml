name: Publish Docker images

# Builds the three runtime images (api, worker, web) for linux/amd64 and
# linux/arm64 and pushes them to GitHub Container Registry. The worker image
# is reused at runtime for the `beat` service — same image, different
# command — so we only need three publishes per push.
#
# Triggers:
#   * Tag push matching `v*` → tagged `<version>` + `latest`
#   * Push to `main`          → tagged `main` + `sha-<7>` (always-fresh edge)
#   * Manual dispatch         → tagged `manual-<run_id>`
on:
  push:
    tags:
      - "v*"
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  # Needed by docker/login-action with GITHUB_TOKEN to push to ghcr.
  packages: write

# Cancel an in-flight run if a newer commit lands on the same ref —
# prevents racing builds for the same image tag.
concurrency:
  group: docker-publish-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: ${{ matrix.image }} (${{ matrix.dockerfile }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: api
            dockerfile: docker/api.Dockerfile
          - image: worker
            dockerfile: docker/worker.Dockerfile
          - image: web
            dockerfile: docker/web.Dockerfile
    steps:
      - uses: actions/checkout@v4

      # QEMU lets us cross-build linux/arm64 from the ubuntu-latest
      # amd64 runner. Buildx is the multi-platform builder driver.
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      # GITHUB_TOKEN already has the right scope thanks to
      # `permissions: packages: write` above.
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

    
