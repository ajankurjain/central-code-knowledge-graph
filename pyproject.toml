[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "central-code-knowledge-graph"
version = "0.1.2"
description = "Central, multi-repo code knowledge graph for AI agents — Neo4j + Tree-sitter + MCP."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Ankur" }]
keywords = ["knowledge-graph", "code-review", "neo4j", "tree-sitter", "mcp", "ai-agents", "graphql", "code-search"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: POSIX",
    "Operating System :: MacOS",
    "Operating System :: Microsoft :: Windows",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Software Development :: Quality Assurance",
]

# Base install (`pip install central-code-knowledge-graph`) is the CLI only —
# everything you need to point `ckg login`, `ckg repo …`, `ckg source …`,
# `ckg arch …`, `ckg search …` at a server running in Docker.
dependencies = [
    "typer>=0.13",
    "httpx>=0.28",
    "rich>=13.9",
]

[project.optional-dependencies]
# Server-side stack (`pip install central-code-knowledge-graph[server]`).
# The Docker image already includes these — only install this extra if you
# want to run the API/worker outside Docker.
server = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "python-multipart>=0.0.12",
    "argon2-cffi>=23.1",
    "pyjwt>=2.9",
    "cryptography>=43.0",
    "neo4j>=5.24",
    "psycopg[binary,pool]>=3.2",
    "sqlalchemy>=2.0.36",
    "alembic>=1.13",
    "redis>=5.2",
    "celery[redis]>=5.4",
    # tree-sitter-language-pack >=1.0 ships its OWN C-extension Parser class
    # (in `builtins`, no public methods) that's incompatible with the upstream
    # `tree_sitter` package — `Parser(get_language(name))` raises
    # "argument 1 must be tree_sitter.Language, not builtins.Language", and
    # the lang-pack's own parser has no `.parse` method. Pin to the 0.7.x
    # range, which still depends on `tree-sitter>=0.23` and re-exports the
    # upstream `tree_sitter.Language` / `Parser` types our parsers use.
    "tree-sitter>=0.24,<0.25",
    "tree-sitter-language-pack>=0.7.4,<0.10",
    "gitpython>=3.1",
    "pyyaml>=6.0",
    "sentence-transformers>=3.3",
    "numpy>=1.26",
    "networkx>=3.4",
    "strawberry-graphql[fastapi]>=0.252",
    "structlog>=24.4",
    "prometheus-client>=0.21",
]

dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "pytest-cov>=6.0",
    "ruff>=0.7",
    "mypy>=1.13",
    # `dev` pulls everything `server` does so the full test suite can run.
    "central-code-knowledge-graph[server]",
]

[project.scripts]
ckg = "ckg.cli.main:app"

[project.urls]
Homepage = "https://github.com/ajankurjain/central-code-knowledge-graph"
Issues = "https://github.com/ajankurjain/central-code-knowledge-graph/issues"
Repository = "https://github.com/ajankurjain/central-code-knowledge-graph"
Changelog = "https://github.com/ajankurjain/central-code-knowledge-graph/releases"
Documentation = "https://github.com/ajankurjain/central-code-knowledge-graph#readme"

[tool.setuptools.packages.find]
where = ["."]
include = ["ckg*"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "N", "SIM", "RUF"]
ignore = [
    "E501",  # line length
    # FastAPI's documented idiom is `_: Principal = Depends(require_repo_read)` —
    # B008 flags the Depends(...) default; we want that pattern.
    "B008",
    # SQLAlchemy idiom: `Session = get_sessionmaker()` then `with Session() as s:`.
    # N806 wants lowercase locals but `Session` here is conventionally PascalCase.
    "N806",
]

[tool.ruff.lint.per-file-ignores]
# Local imports inside functions are deliberate in route handlers to avoid
# Celery app import on cold start.
"ckg/api/routes/repos.py" = ["E402"]
# Tests import after a conditional `HAS_TS = True/False` block — deliberate.
"tests/*.py" = ["E402", "RUF002"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-ra --strict-markers"
